<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#141b1b"><meta name="description" content="山海五侠：五位故人，共赴大荒。写实国风2.5D手机大世界RPG。"><title>山海五侠 · 大荒行纪</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23151d1c'/%3E%3Ctext x='32' y='46' font-size='44' text-anchor='middle' fill='%23cfb580'%3E山%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=13"><meta property="og:type" content="website"><meta property="og:title" content="山海五侠 · 大荒行纪"><meta property="og:description" content="五位故人，共赴大荒。写实国风 2.5D 手机大世界 RPG —— 五个角色，二十五式技能，八片山海。"><meta property="og:image" content="https://111lego.github.io/lego/assets/title-world.webp"><meta property="og:url" content="https://111lego.github.io/lego/"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://111lego.github.io/lego/"></head><body>
<canvas id="world" aria-label="山海大世界游戏画面"></canvas>
<section id="titleScreen" class="screen title-screen"><div class="title-vignette"></div><header class="title-top"><span class="seal">山 海</span><span class="eyebrow">大荒行纪 · 山海卷一</span><button id="accountBtn" class="quiet">注册 / 登录</button></header><div class="title-copy"><p class="eyebrow gold">五位故人 · 一卷山海</p><h1>山海五侠</h1><div class="title-rule"><i></i><span>大 荒 行 纪</span><i></i></div><p class="prologue">越古道，入苍莽。<br>与故人执刃同行，向山海深处。</p><button id="enterWorld" class="primary large">踏 入 大 荒 <span>⟶</span></button><p id="titleProgress" class="fine">八方大荒 · 五种职业 · 存档续行</p></div><footer class="title-footer"><span>山海有灵，故人有约。</span><button id="lbBtn" class="quiet">战力榜</button><button id="titleHelp" class="quiet">游历须知</button><a href="3d.html" class="quiet" style="margin-left:12px;text-decoration:none">3D 版 →</a></footer></section>

<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="authDialog" class="dialog auth-dialog"><button class="close" id="authClose" aria-label="关闭">×</button><p class="eyebrow gold">故人归来</p><h2>山海同行录</h2><p class="muted">账号保存在这台设备的浏览器里，多个账号各自独立存档。</p><div class="auth-tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册新账号</button></div><form id="authForm"><label>用户名<input id="username" name="username" autocomplete="username" minlength="2" maxlength="20" required placeholder="2–20位，支持中文"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required placeholder="至少8位"></label><p id="authError" class="error" role="alert"></p><button id="authSubmit" class="primary" type="submit">登 录</button></form><p class="fine">密码只在本机做 PBKDF2 哈希后保存，不上传任何服务器。<br>换设备或清除浏览器数据后，账号与存档会一起消失。</p></dialog>
